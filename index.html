<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#FAF6F0">
    <title>Gym Systers</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="module" src="/src/main.js"></script>
</head>
<body class="min-h-screen">
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 -translate-y-4 transition-all duration-300">
        <div id="toast-msg" class="bg-paper border border-blush-200 text-ink px-5 py-2.5 rounded-full shadow-cute font-bold text-sm whitespace-nowrap"></div>
    </div>
    <div id="modal-overlay" class="fixed inset-0 bg-ink/30 backdrop-blur-xs z-40 hidden items-center justify-center p-4">
        <div id="modal-box" class="bg-paper rounded-3xl max-w-md w-full p-6 shadow-2xl border border-[#E8DFD5] max-h-[88vh] overflow-y-auto"></div>
    </div>
    <div id="root"></div>
    <div id="rest-timer" class="hidden fixed left-1/2 -translate-x-1/2 bottom-24 md:bottom-6 z-40 w-[calc(100%-2rem)] max-w-sm">
        <div class="bg-ink text-paper rounded-2xl shadow-cute px-4 py-3 overflow-hidden relative">
            <div class="flex items-center justify-between gap-3">
                <div>
                    <p class="text-[11px] font-bold uppercase tracking-wider text-blush-200">Descanso</p>
                    <p data-rest-time class="font-display font-bold text-2xl leading-tight">1:30</p>
                </div>
                <button data-action="rest-stop" class="text-xs font-bold bg-paper/10 hover:bg-paper/20 px-3 py-1.5 rounded-full">Saltar</button>
            </div>
            <div class="absolute left-0 bottom-0 h-1 bg-blush-300 transition-all" data-rest-bar style="width:100%"></div>
        </div>
    </div>
</body>
</html>
